# CSP for HTML/static UI (keep in sync with deploy/Caddyfile).
map $request_uri $ump_csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests";
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    error_page 404 /404.html;

    location = /404.html {
        root /usr/share/nginx/html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $ump_csp always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Do not SPA-fallback sensitive / hidden paths (prevents fake ".env exposed" 200s).
    location ~* (^|/)\.(?!well-known(?:/|$)) {
        return 404;
    }
    location ~* ^/(docker-compose\.ya?ml|composer\.(json|lock)|package(-lock)?\.json|\.npmrc|\.yarnrc)$ {
        return 404;
    }
    location ~* \.(?:env|sql|bak|pem|key|log)$ {
        return 404;
    }

    location /api/ {
        # Backend Helmet owns API security headers (including CSP default-src 'none').
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # BUG-020: long-cache hashed Vite assets; do not SPA-fallback missing files.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $ump_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets-test/ {
        alias /usr/share/nginx/html/assets-test/;
        autoindex off;
        add_header Content-Disposition "attachment";
        add_header Content-Security-Policy $ump_csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Exact SEO / brand files (BUG-019) — never fall through to index.html.
    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files /robots.txt =404;
    }
    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files /sitemap.xml =404;
    }
    location = /logo.png {
        add_header Cache-Control "public, max-age=86400" always;
        try_files /logo.png =404;
    }

    # Serve fe0-admin (rms-admin) under /admin — must be before location /
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://fe0-admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # BUG-019: only known SPA entry routes get index.html; everything else → 404 UI.
    location = / {
        add_header Content-Security-Policy $ump_csp always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    location ~ ^/(login|signup|unauthorized|dashboard|forgot-password)/?$ {
        add_header Content-Security-Policy $ump_csp always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    # Existing static files (favicon, campus image, …) or branded 404.
    location / {
        add_header Content-Security-Policy $ump_csp always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}
