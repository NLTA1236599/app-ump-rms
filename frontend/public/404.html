<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — UMP-RMS</title>
    <link rel="icon" type="image/png" href="/ump-seal.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #5c5c5c;
        --paper: #faf9f7;
        --accent: #0b3d91;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(11, 61, 145, 0.08), transparent 55%),
          var(--paper);
        font-family: Manrope, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 28rem);
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        margin-bottom: 2.25rem;
        color: inherit;
        text-decoration: none;
      }

      .brand img {
        width: 2.25rem;
        height: 2.25rem;
        object-fit: contain;
      }

      .brand span {
        font-family: Fraunces, Georgia, serif;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      h1 {
        margin: 0 0 0.85rem;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(2rem, 5vw, 2.75rem);
        font-weight: 550;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }

      .lead {
        margin: 0 0 0.65rem;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.55;
      }

      .punch {
        margin: 0 0 2rem;
        color: var(--accent);
        font-family: Fraunces, Georgia, serif;
        font-size: 1.2rem;
        font-weight: 600;
        font-style: italic;
        line-height: 1.4;
      }

      .home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .home:hover {
        background: #000;
        transform: translateY(-1px);
      }

      .home:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="UMP-RMS trang chủ">
        <img src="/ump-seal.png" alt="" width="36" height="36" />
        <span>UMP-RMS</span>
      </a>
      <h1>Page not found</h1>
      <p class="lead">UMP-RMS có thể giúp nhiều việc — nhưng tìm trang này thì chịu.</p>
      <p class="punch">Đừng đùa với chụy Béo</p>
      <a class="home" href="/">Về trang chủ</a>
    </main>
  </body>
</html>
