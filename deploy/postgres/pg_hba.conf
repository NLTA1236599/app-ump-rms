# Restrict Postgres to loopback + private/Docker networks.
# Public 0.0.0.0/0 must not be able to authenticate even if the host port is mis-published.
# `local trust` is only the Unix socket inside the container (healthcheck / docker exec).
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256
host    all             all             all                     reject
