server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location ~* (^|/)\.(?!well-known(?:/|$)) {
        return 404;
    }
    location ~* ^/(docker-compose\.ya?ml|composer\.(json|lock)|package(-lock)?\.json|\.npmrc|\.yarnrc)$ {
        return 404;
    }
    location ~* \.(?:env|sql|bak|pem|key|log)$ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Direct access on :5174 when built with base=/admin/
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        rewrite ^/admin/?(.*)$ /$1 break;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; upgrade-insecure-requests" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }

    # Stripped proxy from main frontend (/admin/ → /) and local root assets
    location / {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; upgrade-insecure-requests" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
